# Zoom · 全拼主方案
# 深色现代 · 医学/中医/易经词库 · 强联想
# 词库底座: 雾凇拼音 rime_ice（188 万词条，已内含 rimi.medical/rimi.yijing）
#   dictionary: rimi.mobile  → 词条来自雾凇全量词库
#   prism: rimi           → 拼写棱镜用本方案自己的 algebra（简拼/容错），
#                           多方案共用词库时 prism 必须各自独立（雾凇双拼同款做法）
# 轻量模式（无 vendor/rime-ice）由 rimi-setup/deploy_linux.sh 自动回退 dictionary: rimi
schema:
  schema_id: rimi
  # 🔥 RIME 只认 name 键（schema_name 是无效键，会被忽略导致方案显示名塌缩成
  #    schema_id "rimi"，kimpanel 标签变成 "r" 而不是 "日"——2026-08-17 实证）
  name: "非全盲视障优化输入法"
  version: "0.2.1"
  author:
    - rimi
  description: |-
    基于 RIME 的全拼方案：雾凇拼音 188 万词底座 + 医学/中医/易经专业词库 + 英文联想。
  dependencies:
    - stroke
    - melt_eng        # 英文联想（次翻译器，同雾凇拼音）

# 候选词数量：每页 9 个（默认 RIME 只有 5-7 个，翻页太频繁）
menu:
  page_size: 7
  alternative_select_keys: "123456789"
  page_size_can_be_modified: true

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    reset: 1
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: typo_correction  # 按键误触自动修正（lua/typo_correction_filter.lua）
    states: [ 纠错, 原码 ]
    reset: 1

engine:
  processors:
    - ascii_composer
    - lua_processor@*direct_eng    # 🔥 英文直出（2026-08-29）：正在打字母串（如 wumi）时按左 Shift 直接把这串字母作为英文上屏——词库没有的罕见英文也不再卡手（作用范围：非 ascii_mode + 纯字母 input）
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - script_translator               # 🔥 中文主翻译器必须在 melt_eng/cn_en 之前（同雾凇拼音）：
                                      #    顺序反了会导致单音节输入（ta/wo/de/ni/shi 等）被英文翻译器
                                      #    劫持，候选全是英文（woe/won/woo），中文单字彻底打不出。
                                      #    多音节词（women/zhongguo）不受影响，所以这个 bug 隐蔽——
                                      #    2026-08-21 用 14 组隔离实验实锤（rimi_t10 英文在前复现、
                                      #    rimi_t14 中文在前修复）。
    - table_translator@melt_eng       # 英文联想（同雾凇拼音；缺它打不出英文）
    - table_translator@cn_en          # 中英混合词汇
    - reverse_lookup_translator
  filters:
    - lua_filter@*corrector          # 🔥 错音错字提示 + 清空中文候选后的全拼注释（同雾凇拼音）：
                                     #    spelling_hints 给每个中文候选生成拼音 comment（如「li shi tu」），
                                     #    不挂此滤镜注释会全部显示出来，把候选屏拉得很长（2026-08-21 用户反馈）。
                                     #    挂载后：普通候选注释清空；错音词（厚朴 hòu pò 等）保留矫正提示。
                                     #    顺序铁律：必须在 typo_correction_filter 之前——corrector 会清空
                                     #    非「［拼音］」格式的 comment，误触修正的「← 正确编码」注释放它后面才保得住。
    - lua_filter@*typo_correction_filter   # 按键误触自动修正（全拼+简拼，零干扰；轻量模式自动剔除）
    - lua_filter@*en_completion_guard_filter   # 英文前缀补全守卫（en_full 40万词库配套）：
                                               # 存在中文候选时英文前缀补全词沉底（同雾凇）
    - simplifier@emoji    # 希腊字母/Emoji 联想（同雾凇拼音，数据在 opencc/others.txt）
    - simplifier
    - uniquifier

# 按键误触自动修正（lua/typo_correction_filter.lua）
# 按错一个键时自动把用户真正想打的词放进候选前列，comment 标注正确编码。
# 开关：switches/typo_correction（Ctrl+` 方案选单切「纠错/原码」，默认开）
typo_correction:
  max_candidates: 5     # 注入的修正候选上限
  min_code_length: 4    # 短于此长度的编码不参与修正
  max_code_length: 26   # 超过此长度的编码不参与修正
  scan_cap: 100         # 等长真词扫描的候选数上限（每键开销）
  per_variant_cap: 8    # 每个修正变体最多收集的候选数

# emoji/特殊字符滤镜（配置同雾凇拼音）——没有它 xilazimu 打不出 αΑ βΒ
emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false

# 拼写规则：容错+简拼（联想能力的基础）
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    # 简拼：首字母
    - abbrev/^([a-z]).+$/$1/
    # 声母简拼 zh/ch/sh -> z/c/s
    - abbrev/^([zcs])h/$1/
    # 常见拼写容错
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/

translator:
  # 按键误触自动修正：librime 内置键盘邻键容错（NearSearchCorrector），
  # 按错一个键/两键按反仍能找到目标词，简拼全拼均可。零代码全平台。
  enable_correction: false
  # 🔥 2026-08-17 用户反馈修复: 原 dictionary: rimi 靠 use_preset_vocabulary 取通用词，
  # 用户环境预设加载失败 → 主词库只剩 84KB 医学/易经词，常用词全丢。
  # 改用雾凇 rime_ice 词库（188 万词条，其 import_tables 已含 rimi.medical/rimi.yijing）。
  # prism 保持 rimi：拼写棱镜用本方案自己的 algebra（简拼/容错），不与雾凇方案冲突。
  dictionary: rimi.mobile
  prism: rimi
  # 用户词库：自学习落盘（重中之重）
  user_dict: user
  db_class: userdb
  # 用户词高权重置顶
  initial_quality: 10
  enable_user_dict: true
  enable_sentence: true
  enable_encoder: true
  encode_commit_history: true
  max_phrase_length: 9
  enable_completion: true
  spelling_hints: 5
  # 🔥 corrector.lua 依赖（同雾凇拼音上游配置）：
  #   spelling_hints 把候选词完整拼音写进 comment；comment_format 包上全角［］
  #   作为 lua 识别标记；always_show_comments 防 librime 在 preedit==comment 时
  #   吞掉注释导致 lua 匹配不到（单字输入必现）。corrector 挂载后普通候选的
  #   ［拼音］注释被清空、只保留错音错字矫正提示——2026-08-21 用户反馈的
  #   「中文候选后面拖全拼把候选屏拉超长」即由此根治。
  always_show_comments: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  comment_format:
    - xform/~//
    - xform/^/［/
    - xform/$/］/

# 次翻译器，英文（配置同雾凇拼音）
melt_eng:
  dictionary: melt_eng
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.1
  comment_format:
    - xform/.*//

# 中英混合词汇（en_dicts/cn_en）
cn_en:
  dictionary: ""
  user_dict: en_dicts/cn_en
  db_class: stabledb
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.5
  comment_format:
    - xform/^.+$//

# 自定义短语（置顶常用语，userdb stabledb）
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "x"
  suffix: "'"
  tips: 〔笔画〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/

punctuator:
  import_preset: default
  # v 模式符号表（同雾凇拼音：vxl→希腊字母、vrq→日期 等，数据在 symbols_v.yaml）
  symbols:
    __include: symbols_v:/symbols

key_binder:
  import_preset: default
  bindings:
    # 语音输入热键占位（rimid 监听全局热键，RIME 侧不处理）
    - { when: composing, accept: Control+Shift+4, send: Page_Up }
    - { when: composing, accept: Control+Shift+5, send: Page_Down }

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "^x[a-z]*'?$"
    # v 模式响应 symbols_v.yaml（同雾凇拼音）
    punct: "^v([0-9]|10|[A-Za-z]+)$"
